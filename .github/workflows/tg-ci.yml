name: Build & push latest build to TG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  publish:
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: archlinux
            uname: x86_64
          - goos: linux
            goarch: arm64
            platform: archlinux
            uname: aarch64
          - goos: windows
            goarch: amd64
            platform: windows
            uname: x86_64
          - goos: windows
            goarch: arm64
            platform: windows
            uname: aarch64

    steps:
      - name: Prepare Arch Linux container
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git curl

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git status --short

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        run: go mod download && go mod verify

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          extension=""
          if [ "${GOOS}" = "windows" ]; then
            extension=".exe"
          fi
          name="r34-dl-${short}-${{ matrix.platform }}-${{ matrix.uname }}${extension}"
          out="${GITHUB_WORKSPACE}/dist/${name}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          go build -trimpath \
            -ldflags "-s -w -X moxiu/r34-dl/ui.buildVersion=dev -X moxiu/r34-dl/ui.buildCommit=${GITHUB_SHA}" \
            -o "${out}" .
          sha256sum "${out}" > "${out}.sha256"
          ls -l "${out}" "${out}.sha256"
          echo "path=${out}" >> "${GITHUB_OUTPUT}"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@r34_dl' }}
          LABEL: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
          ARTIFACT: ${{ steps.build.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "missing TELEGRAM_BOT_TOKEN repository secret" >&2
            exit 1
          fi
          echo "publishing ${ARTIFACT}"
          pwd
          ls -la "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}/dist" || true
          if [ ! -f "${ARTIFACT}" ]; then
            echo "artifact missing: ${ARTIFACT}" >&2
            exit 1
          fi
          digest="$(cut -d' ' -f1 "${ARTIFACT}.sha256")"
          caption="${LABEL} build (${{ matrix.platform }}/${{ matrix.uname }}) | commit: ${GITHUB_SHA} | sha256: ${digest}"
          echo "caption: ${caption}"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "caption=${caption}" \
            --form "document=@${ARTIFACT}"
