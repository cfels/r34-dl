name: Build & push latest build to TG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - name: Prepare Arch Linux container
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git curl

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory '*'
          git status --short

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download modules
        run: go mod download && go mod verify

      - name: Build
        id: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          name="r34-dl-${short}-archlinux-${{ matrix.goarch }}"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X moxiu/r34-dl/ui.buildVersion=dev -X moxiu/r34-dl/ui.buildCommit=${GITHUB_SHA}" \
            -o "dist/${name}" .
          echo "path=dist/${name}" >> "${GITHUB_OUTPUT}"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@r34_dl' }}
          LABEL: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
          ARTIFACT: ${{ steps.build.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ]; then
            echo "missing TELEGRAM_BOT_TOKEN repository secret" >&2
            exit 1
          fi
          caption="${LABEL} build (archlinux/${{ matrix.goarch }}) | commit: ${GITHUB_SHA}"
          echo "publishing ${ARTIFACT}"
          echo "caption: ${caption}"
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "caption=${caption}" \
            --form "document=@${ARTIFACT}"
